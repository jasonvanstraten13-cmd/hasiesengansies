[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Keep server code, docs and local config out of the public site.
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/404"
  status = 404
  force = true


# The Say and Play Space is deployed as its own site (base directory say-and-play-space).
[[redirects]]
  from = "/say-and-play-space/*"
  to = "/404"
  status = 404
  force = true
